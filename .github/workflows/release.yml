name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${TAG}" >> "${GITHUB_ENV}"

          tmp=$(mktemp)
          jq --arg v "${TAG}" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          jq --arg v "${TAG}" '.version = $v' public/manifest.json > "$tmp" && mv "$tmp" public/manifest.json

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Verify extension output
        run: test -d dist && test -f dist/manifest.json

      - name: Package extension
        run: cd dist && zip -r ../ai-job-copilot-v${VERSION}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${VERSION}"
          files: ai-job-copilot-v*.zip
          generate_release_notes: true