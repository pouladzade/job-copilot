name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # F-10: Run the full multi-target build once via `pnpm build` (which
      # already produces chrome, firefox, and safari outputs). The old flow
      # invoked the parent build and then rebuilt firefox/safari separately,
      # producing redundant work and weaker artifact provenance.
      - name: Build (Chrome + Firefox + Safari)
        run: pnpm run build

      - name: Verify extension output
        run: |
          test -d .output/chrome-mv3
          test -f .output/chrome-mv3/manifest.json
          test -d .output/firefox-mv3
          test -f .output/firefox-mv3/manifest.json
          test -d .output/safari-mv3
          test -f .output/safari-mv3/manifest.json

      # F-14: programmatic manifest contract check on each browser output.
      - name: Verify manifests
        run: pnpm run test:manifest
