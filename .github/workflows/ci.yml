name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (backend only — with coverage)
        run: pnpm --filter @job-hunter/backend run test -- --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: jobhunter
          DB_PASSWORD: jobhunter
          DB_NAME: jobhunter
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: packages/backend/coverage
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-hunter/shared run build

      - name: Build backend
        run: pnpm --filter @job-hunter/backend run build

      - name: Build extension
        run: pnpm --filter @job-hunter/extension run build

      - name: Verify extension output
        run: test -d packages/extension/dist && test -f packages/extension/dist/manifest.json
