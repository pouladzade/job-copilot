<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Copilot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Firefox auto-grows the popup to fit content unless html itself
         is explicitly sized. Set both html and body so the popup is
         locked to 420x560 and the inner overflow-y:auto can scroll. */
      html,
      body,
      #app {
        width: 420px;
        height: 560px;
      }
      html,
      body {
        overflow: hidden;
        background: #171627;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../../src/popup/App.tsx"></script>
  </body>
</html>
